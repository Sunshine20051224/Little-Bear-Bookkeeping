name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bear_ci
          POSTGRES_USER: bear_ci
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bear_ci -d bear_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare test environment and run pytest
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./ci_test.db
          TEST_DATABASE_URL: sqlite:///./ci_test.db
          MAINTENANCE_TEST_POSTGRES_URL: postgresql+psycopg2://bear_ci:local_ci_only@127.0.0.1:5432/bear_ci
        run: |
          python -m pytest -v
